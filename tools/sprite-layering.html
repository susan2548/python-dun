<!doctype html><html lang="th"><head><meta charset="utf-8"><base href="../"><title>Sprite fallback layering QA</title>
<link rel="stylesheet" href="styles.css?v=4"><link rel="stylesheet" href="combat.css?v=2"><link rel="stylesheet" href="combat-polish.css?v=2"><link rel="stylesheet" href="monster-effects.css?v=1">
<style>body{padding:24px}h1{font-size:24px}button{padding:14px;margin:8px}.battle-scene{max-width:1100px;height:400px}pre{white-space:pre-wrap;font:12px/1.5 monospace;color:#bff3d8}</style></head>
<body><h1>ตรวจภาพนิ่งไม่ซ้อนกับแอนิเมชัน</h1><button id="run">ทดสอบมอนสเตอร์ใหม่ทั้ง 6 ตัว</button><p id="now"></p><div class="battle-scene" id="scene"></div><pre id="result"></pre>
<script type="module">
import {LEVELS} from './campaign.js?v=1';
import {NEW_MONSTER_KINDS} from './animation-profiles.js?v=2';
import {playCombatMotion} from './combat-cinema.js?v=10';
import {enemyIntent} from './combat-rules.js?v=5';
const before=new URLSearchParams(location.search).get('before')==='1';
const {mountSpriteMotion}=await import(before?'/asset-sources/sprite-motion-before-v1152.mjs':'./sprite-motion.js?v=8');
const $=s=>document.querySelector(s),levels=LEVELS.map((l,index)=>({...l,index})).filter(l=>NEW_MONSTER_KINDS.includes(l.kind));
function inspect(){const actor=$('.fighter.enemy');return {background:getComputedStyle(actor).backgroundImage,canvases:actor.querySelectorAll('canvas').length};}
async function mount(l){
 $('#scene').style.setProperty('--scene',`url('./assets/${l.scene}.png')`);
 // Match renderBattle's inline loading portrait, including its CSS precedence.
 $('#scene').innerHTML=`<div class="fighter hero"></div><div class="fighter enemy" style="background-image:url('./assets/animation-v15/${l.kind}-portrait.png');background-size:contain;background-position:center bottom"></div>`;
 const fallback=inspect();await mountSpriteMotion(0,l.kind);return fallback;
}
$('#run').onclick=async()=>{
 $('#run').disabled=true;const results=[];
 try{for(const l of levels){$('#now').textContent=l.enemy;const fallback=await mount(l),idle=inspect(),actions=[];
 for(const turn of [1,2]){let contacts=0,overlap=false;const move=enemyIntent(l.index,turn);const watch=setInterval(()=>{if(inspect().background!=='none')overlap=true;},16);
 try{await playCombatMotion('enemy',move.variant,()=>contacts++);}finally{clearInterval(watch);}
 actions.push({variant:move.variant,contacts,overlap,after:inspect()});}
 const pass=fallback.background!=='none'&&fallback.canvases===0&&idle.background==='none'&&idle.canvases===1&&actions.every(a=>a.contacts===1&&!a.overlap&&a.after.background==='none'&&a.after.canvases===1);
 results.push({kind:l.kind,fallback,idle,actions,pass});$('#result').textContent=JSON.stringify({before,passed:results.filter(r=>r.pass).length,total:results.length,results},null,2);
 }}catch(error){results.push({error:String(error)});}finally{$('#run').disabled=false;$('#now').textContent='จบการตรวจ';$('#result').textContent=JSON.stringify({before,passed:results.filter(r=>r.pass).length,total:results.length,results},null,2);}
};
await mount(levels.find(l=>l.kind==='sentinel'));
</script></body></html>
