<!doctype html><html lang="th"><head><meta charset="utf-8"><base href="/"><title>Menu music QA v1.18</title><link rel="stylesheet" href="styles.css"><style>body{padding:25px}button{padding:14px;margin:5px}pre{white-space:pre-wrap}img{max-width:350px}</style></head><body><h1>ตรวจเพลงและตรารูน</h1><img src="assets/brand/runegate-serpent.svg" width="100" alt="งูพันประตูรูน"><img src="assets/brand/python-dungeon-wordmark.svg" width="280" alt="Python Dungeon"><div><button id="intro">เล่นเพลงหน้าเลือกตัวละคร</button><button id="map">เล่นเพลงแผนที่</button><button id="battle">เพลงต่อสู้เดิม</button><button id="rapid">สลับฉากเร็ว 12 ครั้ง</button><button id="same">เลือกฉากเดิมซ้ำ</button><button id="mute">ปิดเสียง</button><button id="inspect">ตรวจสถานะ</button></div><pre id="report" role="status"></pre><script type="module">
import {setMuted,switchTrack,currentTrackName} from './audio-engine.js?v=6';
const $=s=>document.querySelector(s);let selected='intro',previous;
const inspect=()=>{const a=$('#dungeonMusic');$('#report').textContent=JSON.stringify({track:currentTrackName(),elements:document.querySelectorAll('#dungeonMusic').length,file:a?.getAttribute('src'),playing:a?!a.paused:false,time:a?.currentTime,ready:a?.readyState,loop:a?.loop,volume:a?.volume,sameElement:previous?a===previous:undefined},null,2);};
async function choose(key){selected=key;switchTrack(key);await setMuted(false);inspect();}
$('#intro').onclick=()=>choose('intro');$('#map').onclick=()=>choose('map');$('#battle').onclick=()=>choose('floor0');
$('#rapid').onclick=async()=>{await setMuted(false);for(let i=0;i<12;i++)switchTrack(i%2?'map':'intro');selected='map';inspect();};
$('#same').onclick=()=>{previous=$('#dungeonMusic');switchTrack(selected);inspect();};
$('#mute').onclick=async()=>{await setMuted(true);inspect();};$('#inspect').onclick=inspect;
</script></body></html>
